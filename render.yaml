# Render Blueprint for ShopSense.
# Docs: https://render.com/docs/blueprint-spec
#
# Notes:
#  - The app needs Node >= 22.5 (it uses the built-in node:sqlite module).
#  - A persistent disk keeps the SQLite database across deploys/restarts.
#    Disks require a paid instance type (plan: starter). On the free plan,
#    remove the `disk` block and the SHOPSENSE_DB variable below — the app
#    still works, but accounts/cart/orders reset on restart.
services:
  - type: web
    name: shopsense
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: SHOPSENSE_DB
        value: /var/data/shopsense.db
    disk:
      name: shopsense-data
      mountPath: /var/data
      sizeGB: 1
