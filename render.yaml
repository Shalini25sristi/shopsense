# Render Blueprint for ShopSense.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: shopsense
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        value: "https://nzccgolsbffelzdxtkom.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
